services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: handels
      POSTGRES_PASSWORD: handels
      POSTGRES_DB: handels
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handels -d handels"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://handels:handels@postgres:5432/handels
      SESSION_SECRET: ${SESSION_SECRET:-change-me-before-you-share-this}
      UPLOAD_DIR: /data/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default: {}
      homelab-network:
        aliases:
          - handels-ratings
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:

networks:
  homelab-network:
    external: true
